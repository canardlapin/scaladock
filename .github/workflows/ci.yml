name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Check formatting
        run: sbt scalafmtCheckAll
      - name: Compile and test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum sbt compile test
      - name: Compile and test (macOS)
        if: runner.os == 'macOS'
        run: sbt compile test
